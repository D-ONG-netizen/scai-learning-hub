<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E6E5E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>SCAI ME1 Study Hub v2</title>
<style>
:root{
  --bg:#F5F6F2;
  --bg2:#EAEEE9;
  --surface:#FFFFFF;
  --surface2:#F8F9F6;
  --ink:#17211C;
  --muted:#5F6C66;
  --line:#D8DED8;
  --grid:rgba(23,33,28,.045);
  --halo:rgba(46,110,94,.08);
  --accent:#C4522E;
  --accent-soft:#F6E5DE;
  --teal:#2E6E5E;
  --teal-soft:#E1EEE9;
  --blue:#3B6F8F;
  --blue-soft:#E3EDF2;
  --gold:#A67C00;
  --gold-soft:#F4EBD4;
  --danger:#B3402E;
  --danger-soft:#F7E2DD;
  --ok:#2E6E5E;
  --ok-soft:#E1EEE9;
  --shadow:0 12px 34px rgba(23,33,28,.08);
  --radius:8px;
  --font-display:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;
  --font-body:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --font-mono:"Cascadia Mono","Consolas","Courier New",monospace;
}
:root[data-theme="dark"]{
  --bg:#101512;
  --bg2:#151C18;
  --surface:#1A221E;
  --surface2:#202B25;
  --ink:#E8EEE9;
  --muted:#9AA79F;
  --line:#33413A;
  --grid:rgba(232,238,233,.035);
  --halo:rgba(93,163,150,.07);
  --accent:#E0704D;
  --accent-soft:#3A2720;
  --teal:#5DA396;
  --teal-soft:#213832;
  --blue:#77A7C2;
  --blue-soft:#21333D;
  --gold:#D1A93E;
  --gold-soft:#3A3218;
  --danger:#E07A68;
  --danger-soft:#3A241F;
  --ok:#7BC0A4;
  --ok-soft:#1F3A30;
  --shadow:0 14px 38px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:radial-gradient(1100px 540px at 82% -8%,var(--halo),transparent 62%);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{position:relative;z-index:1;min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:11px clamp(16px,4vw,40px);
  background:var(--surface);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(23,33,28,.02);
}
.brand{
  font-family:var(--font-display);font-weight:700;font-size:1.06rem;letter-spacing:.05em;
  color:var(--ink);text-decoration:none;white-space:nowrap;
}
.brand span{color:var(--accent)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{
  padding:8px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:.92rem;
  border-bottom:2px solid transparent;
}
.nav a:hover{color:var(--ink)}
.nav a.active{color:var(--ink);background:var(--surface2);border-bottom-color:var(--accent)}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);
}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:17px;height:17px}
main{width:min(1180px,100% - 32px);margin:0 auto;padding:34px 0 90px}
.hero{padding:26px 0 22px;border-bottom:1px solid var(--line);margin-bottom:26px}
.kicker{
  font:600 .76rem/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
}
.hero h1{
  font-family:var(--font-display);font-size:clamp(2rem,5vw,3.25rem);line-height:1.08;
  margin:10px 0 10px;font-weight:600;text-wrap:balance;
}
.hero p{max-width:70ch;color:var(--muted);margin:0}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;font-variant-numeric:tabular-nums;
}
.stat b{display:block;font-family:var(--font-display);font-size:1.85rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.85rem}
.section{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 14px}
.section h2{font-family:var(--font-display);font-size:1.5rem;margin:0;font-weight:600}
.section .note{color:var(--muted);font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:1.05rem}
.panel p{margin:6px 0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--ink);font-size:.92rem;text-decoration:none;
}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(.94)}
.btn-ghost{background:transparent}
.course-list{display:grid;gap:10px}
.course-row{
  display:grid;grid-template-columns:8px 1fr auto;gap:16px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 18px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s;
}
.course-row:hover{border-color:var(--accent);transform:translateY(-1px)}
.course-row .bar{width:6px;height:46px;border-radius:4px;background:var(--accent)}
.course-row h3{margin:0;font-size:1.06rem}
.course-row p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.course-row .meta{font-family:var(--font-mono);font-size:.76rem;color:var(--muted);text-align:right}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:.76rem;font-weight:600;white-space:nowrap;
}
.tag-point{background:var(--teal-soft);color:var(--teal)}
.tag-pitfall{background:var(--danger-soft);color:var(--danger)}
.tag-exam{background:var(--gold-soft);color:var(--gold)}
.tag-blue{background:var(--blue-soft);color:var(--blue)}
.lesson{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;overflow:hidden}
.lesson summary{
  cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  list-style:none;
}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary .ltitle{font-weight:600;font-size:.98rem}
.lesson summary .lmeta{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.lesson[open] summary{border-bottom:1px solid var(--line);background:var(--surface2)}
.lesson-body{padding:16px}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.lesson-col h4{
  margin:0 0 8px;font:700 .78rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
}
.lesson-col.points h4{color:var(--teal)}
.lesson-col.pitfalls h4{color:var(--danger)}
.lesson-col.exams h4{color:var(--gold)}
.lesson-col ul{margin:0;padding-left:18px}
.lesson-col li{margin:5px 0;font-size:.9rem}
.lesson-col.points li::marker{color:var(--teal)}
.lesson-col.pitfalls li::marker{color:var(--danger)}
.lesson-col.exams li::marker{color:var(--gold)}
.video-list{display:grid;gap:8px}
.video-link{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
  text-decoration:none;color:inherit;background:var(--surface2);font-size:.9rem;
}
.video-link:hover{border-color:var(--accent)}
.video-link .src{font-family:var(--font-mono);font-size:.72rem;color:var(--accent);white-space:nowrap}
.quiz .qitem{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.qitem legend{font-weight:600;padding:0 4px}
.qitem .opt{display:block;padding:8px 10px;border:1px solid transparent;border-radius:6px;margin-top:5px;cursor:pointer}
.qitem .opt:hover{background:var(--surface2)}
.qitem .opt input{margin-right:8px}
.qitem.correct{border-color:var(--ok);background:var(--ok-soft)}
.qitem.wrong{border-color:var(--danger);background:var(--danger-soft)}
.q-explain{font-size:.88rem;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.quiz-actions{display:flex;gap:10px;margin-top:14px}
.quiz-score{
  font-family:var(--font-mono);font-size:.95rem;padding:12px 14px;border-radius:var(--radius);
  background:var(--surface2);border:1px solid var(--line);margin-top:14px;
}
.practice-list{display:grid;gap:8px}
.practice-link{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);text-decoration:none;color:inherit;
}
.practice-link:hover{border-color:var(--teal)}
.practice-link .note{color:var(--muted);font-size:.82rem}
.pdf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pdf-link{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);text-decoration:none;color:inherit;
}
.pdf-link:hover{border-color:var(--accent);background:var(--surface2)}
.pdf-link b{display:block;font-size:.92rem;line-height:1.35}
.pdf-link small{color:var(--muted);font-size:.78rem}
.pdf-link .file-badge{
  flex:0 0 auto;font-family:var(--font-mono);font-size:.7rem;padding:5px 8px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent);font-weight:700;
}
.pdf-lib-grid{display:grid;gap:10px}
.pdf-lib-course{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px}
.pdf-lib-course h3{margin:0 0 4px}
.pdf-lib-course .sub{color:var(--muted);font-size:.84rem;margin-bottom:12px}
.week-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.week-tabs button{
  padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  cursor:pointer;font-size:.85rem;color:var(--muted);
}
.week-tabs button:hover{color:var(--ink)}
.week-tabs button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-theme="dark"] .week-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.focus-list{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.focus-chip{
  padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);font-size:.86rem;
}
.check-list{list-style:none;margin:8px 0;padding:0}
.check-list li{padding:6px 0 6px 26px;position:relative;font-size:.92rem}
.check-list li::before{
  content:"✓";position:absolute;left:2px;top:6px;width:17px;height:17px;border-radius:50%;
  background:var(--teal-soft);color:var(--teal);font-size:.72rem;display:flex;align-items:center;justify-content:center;
}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:700 .75rem/1.2 var(--font-mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
tr:last-child td{border-bottom:none}
.compare-table td{min-width:150px}
.term-table td:first-child{font-family:var(--font-mono);font-size:.82rem;color:var(--accent)}
.dual-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.dual-tabs button{
  padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  color:var(--muted);font-size:.86rem;cursor:pointer;
}
.dual-tabs button:hover{color:var(--ink);border-color:var(--teal)}
.dual-tabs button.active{background:var(--teal);border-color:var(--teal);color:#fff}
.book-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin:0 0 16px}
.book-card{border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.book-card.zh{border-left-color:var(--accent)}
.book-card.en{border-left-color:var(--blue)}
.book-card .pair-role{font:700 .72rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.book-card.zh .pair-role{color:var(--accent)}
.book-card.en .pair-role{color:var(--blue)}
.book-card h3{margin:4px 0;font-family:var(--font-display);font-size:1.08rem}
.book-card p{margin:2px 0;font-size:.82rem;color:var(--muted)}
.pair-arrow{align-self:center;font-size:.82rem;font-weight:700;color:var(--gold);white-space:nowrap}
.dual-legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;font-size:.8rem;color:var(--muted)}
.dual-legend span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.dual-block{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  padding:16px;margin-bottom:12px;
}
.dual-block .phase{font:700 .72rem/1 var(--font-mono);letter-spacing:.08em;color:var(--teal);text-transform:uppercase}
.dual-block h3{margin:4px 0 6px;font-family:var(--font-display);font-size:1.12rem}
.dual-range{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.dual-range div{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:.86rem}
.dual-range small{display:block;font:700 .68rem/1 var(--font-mono);letter-spacing:.06em;margin-bottom:4px;text-transform:uppercase}
.dual-range .z{color:var(--accent)}
.dual-range .e{color:var(--blue)}
.dual-mark{display:grid;gap:7px;margin-top:10px}
.dual-mark p{margin:0;padding:8px 11px;border-radius:6px;font-size:.85rem;line-height:1.55}
.dual-mark .same{background:var(--ok-soft);color:var(--ok)}
.dual-mark .zh{background:var(--accent-soft);color:var(--accent)}
.dual-mark .en{background:var(--blue-soft);color:var(--blue)}
.dual-mark b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.dual-rule{margin-top:10px;font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.code-lab{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;margin-bottom:12px}
.code-lab h3{margin:0 0 2px;font-family:var(--font-display);font-size:1.05rem}
.code-lab .note{color:var(--muted);font-size:.82rem;margin-bottom:10px}
.code-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.code-col{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.code-col .code-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font:700 .72rem/1 var(--font-mono);color:var(--accent);background:var(--accent-soft)}
.code-col.en .code-head{color:var(--blue);background:var(--blue-soft)}
.code-col pre{
  margin:0;padding:12px;background:var(--surface2);overflow:auto;font:12px/1.55 var(--font-mono);
  white-space:pre;color:var(--ink);
}
.dual-year{overflow:hidden}
.term-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:16px;overflow:hidden}
.term-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.term-head h3{margin:0;font-family:var(--font-display);font-size:1.2rem}
.term-head p{margin:0;color:var(--muted);font-size:.82rem}
.year-phase{padding:13px 16px;border-bottom:1px solid var(--line)}
.year-phase:last-child{border-bottom:none}
.year-phase .yr{font:700 .74rem/1 var(--font-mono);color:var(--teal);letter-spacing:.05em}
.phase-line{display:grid;grid-template-columns:130px 1fr;gap:8px;margin-top:6px;font-size:.84rem}
.phase-line b{color:var(--muted);font-weight:600;font-size:.78rem;padding-top:1px}
.phase-line p{margin:0}
.phase-line.merged p{color:var(--ok)}
.phase-line.zh p{color:var(--accent)}
.phase-line.en p{color:var(--blue)}
.dual-resource-list{display:grid;gap:8px}
.deep-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 24px}
.deep-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.deep-stat b{display:block;font:700 1.65rem/1.1 var(--font-display)}
.deep-stat span{color:var(--muted);font-size:.8rem}
.deep-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.deep-toolbar button,.deep-toolbar a{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);text-decoration:none}
.deep-toolbar button:hover,.deep-toolbar button.active,.deep-toolbar a:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.deep-book{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin:0 0 12px;overflow:hidden}
.deep-book>summary{cursor:pointer;list-style:none;padding:17px 18px;display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:14px;align-items:center}
.deep-book>summary::-webkit-details-marker{display:none}
.deep-book>summary .deep-bar{width:7px;height:52px;border-radius:4px;background:var(--deep,var(--teal))}
.deep-book>summary h3{margin:0;font:600 1.08rem/1.35 var(--font-display)}
.deep-book>summary p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.deep-book>summary .meta{text-align:right;color:var(--muted);font:600 .73rem/1.5 var(--font-mono)}
.deep-body{padding:0 18px 18px;border-top:1px solid var(--line)}
.deep-summary{padding:16px 0 10px}
.deep-summary p{margin:4px 0}
.deep-mindmap{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 15px}
.deep-mindmap span{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);font-size:.78rem}
.chapter-list{display:grid;gap:8px}
.chapter-card{border:1px solid var(--line);border-radius:6px;background:var(--surface2);overflow:hidden}
.chapter-card>summary{cursor:pointer;list-style:none;padding:11px 13px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.chapter-card>summary::-webkit-details-marker{display:none}
.chapter-card>summary b{font-size:.9rem}
.chapter-card>summary small{color:var(--muted);font-size:.76rem;text-align:right}
.chapter-body{padding:0 13px 13px;border-top:1px dashed var(--line)}
.chapter-body>p{margin:10px 0;color:var(--muted);font-size:.88rem}
.chapter-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px}
.chapter-grid h5{margin:0 0 5px;font:700 .72rem/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.chapter-grid ul{margin:0;padding-left:17px}
.chapter-grid li{margin:3px 0;font-size:.82rem}
.syllabus-card{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:var(--radius);background:var(--surface);padding:16px 18px;margin-bottom:12px}
.syllabus-card h3{margin:0 0 6px;font-family:var(--font-display)}
.syllabus-meta{color:var(--muted);font-size:.82rem;margin:2px 0}
.syllabus-weeks{display:grid;gap:7px;margin-top:12px}
.syllabus-week{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);font-size:.84rem}
.syllabus-week b{color:var(--blue)}
.syllabus-week.current{border-color:var(--accent);background:var(--accent-soft)}
.syllabus-week.current b{color:var(--accent)}
.course-deep-shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.course-deep-shelf a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none;color:inherit}
.course-deep-shelf a:hover{border-color:var(--accent)}
.course-deep-shelf b{display:block;font-size:.92rem}
.course-deep-shelf small{display:block;color:var(--muted);margin-top:3px}
.tt-grid{display:grid;grid-template-columns:90px repeat(5,1fr);gap:6px;overflow-x:auto;min-width:660px}
.tt-head{font-weight:700;font-size:.85rem}
.tt-cell{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:.8rem;min-height:46px}
.tt-cell .tt-course{font-weight:600}
.drop{border:1px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;background:var(--surface2)}
.drop strong{display:block;margin-bottom:6px}
.drop small{color:var(--muted)}
.file-list{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.file-list li{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:.88rem;
}
.file-list .fname{font-weight:600}
.file-list .fmeta{color:var(--muted);font-family:var(--font-mono);font-size:.75rem}
.file-list button{border:none;background:none;color:var(--danger);cursor:pointer;font-size:.82rem}
.insight-panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;margin-top:14px}
.insight-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.insight-head h3{margin:0;font-family:var(--font-display);font-size:1.08rem}
.insight-head p{margin:3px 0 0;color:var(--muted);font-size:.8rem}
.insight-actions{display:flex;flex-wrap:wrap;gap:7px}
.insight-actions .btn{padding:7px 10px;font-size:.78rem}
.insight-summary{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:0 6px 6px 0;padding:10px 12px;font-size:.88rem;margin-bottom:12px}
.insight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.insight-col{border:1px solid var(--line);border-radius:6px;background:var(--surface2);padding:11px 12px}
.insight-col h4{margin:0 0 6px;font:700 .73rem/1 var(--font-mono);letter-spacing:.06em}
.insight-col.key h4{color:var(--teal)}
.insight-col.warn h4{color:var(--danger)}
.insight-col.exam h4{color:var(--gold)}
.insight-col ul{margin:0;padding-left:17px}
.insight-col li{font-size:.82rem;margin:4px 0}
.insight-mindmap{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface2);padding:14px;overflow-x:auto}
.insight-mindmap-root{display:inline-flex;align-items:center;justify-content:center;min-width:180px;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;margin-bottom:12px}
.insight-mindmap-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.insight-branch{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px 11px}
.insight-branch::before{content:"";position:absolute;left:-7px;top:16px;width:7px;height:2px;background:var(--accent)}
.insight-branch b{display:block;color:var(--blue);font-size:.84rem;margin-bottom:5px}
.insight-branch span{display:block;font-size:.78rem;color:var(--muted);margin:3px 0}
.insight-loading{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.86rem}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.chat-panel{
  position:fixed;right:20px;bottom:20px;width:min(410px,calc(100vw - 32px));
  max-height:min(74vh,740px);background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:50;
  transform:translateY(18px);opacity:0;pointer-events:none;transition:transform .18s ease,opacity .18s ease;
}
.chat-panel.open{transform:none;opacity:1;pointer-events:auto}
.chat-head{
  display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
  border-bottom:1px solid var(--line);
}
.chat-head b{font-family:var(--font-display);font-size:1rem}
.chat-head .sub{color:var(--muted);font-size:.75rem}
.chat-head button{border:none;background:none;color:var(--muted);font-size:1.2rem;line-height:1}
.chat-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:48vh}
.msg{max-width:88%;padding:10px 12px;border-radius:11px;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--bg)}
.msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--line)}
.msg .mhead{display:block;font:700 .68rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;color:var(--muted)}
.msg.user .mhead{color:var(--muted)}
.chat-actions{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
.chat-actions .btn{flex:1;padding:8px 10px;font-size:.82rem}
.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-form input{
  flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--ink);
}
.chat-form button{padding:10px 14px}
.modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(10,15,12,.5);opacity:0;pointer-events:none;transition:opacity .18s ease;
  padding:16px;
}
.modal.open{opacity:1;pointer-events:auto}
.modal-panel{
  width:min(580px,100%);background:var(--surface);border-radius:14px;padding:24px;
  max-height:86vh;overflow:auto;box-shadow:var(--shadow);
}
.modal-panel h2{margin:0 0 16px;font-family:var(--font-display);font-size:1.35rem}
.form-grid{display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:.84rem;font-weight:600}
.field input,.field select{
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);
}
.field small{color:var(--muted);font-size:.78rem}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:70;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);padding:18px 0;font-size:.9rem}
.divider{border:none;border-top:1px solid var(--line);margin:24px 0}
.search-modal{
  position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-start;
  padding:10vh 16px 16px;background:rgba(10,15,12,.46);opacity:0;pointer-events:none;transition:opacity .16s ease;
}
.search-modal.open{opacity:1;pointer-events:auto}
.search-panel{
  width:min(680px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden;
}
.search-panel input{
  width:100%;padding:15px 18px;border:none;border-bottom:1px solid var(--line);
  background:var(--surface2);color:var(--ink);font-size:1rem;outline:none;
}
.search-results{max-height:52vh;overflow:auto;padding:8px;display:grid;gap:6px}
.search-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;
  width:100%;padding:10px 12px;border:1px solid transparent;border-radius:var(--radius);
  background:transparent;color:var(--ink);font-size:.9rem;cursor:pointer;
}
.search-item:hover,.search-item.active{background:var(--surface2);border-color:var(--line)}
.search-item b{display:block;font-weight:600}
.search-item small{color:var(--muted);font-size:.76rem}
.search-item .s-tag{flex:0 0 auto;font-family:var(--font-mono);font-size:.68rem;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:999px}
.search-hint{padding:9px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:.76rem}
.progress-wrap{display:grid;gap:8px;margin:10px 0}
.progress-track{height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .3s ease}
.progress-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.82rem}
.lesson-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 4px}
.lesson-tools .btn{padding:7px 11px;font-size:.8rem}
.lesson-extra-links{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 4px}
.lesson-extra-links .btn{padding:8px 12px;font-size:.84rem}
.status-chip{font-size:.76rem;font-weight:600;color:var(--muted)}
.status-chip.done{color:var(--teal)}
.status-chip.review{color:var(--gold)}
.lesson-notes{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.lesson-notes h4{margin:0 0 6px;font:700 .76rem/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--blue)}
.lesson-notes textarea{
  width:100%;min-height:84px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface2);color:var(--ink);font:inherit;font-size:.88rem;line-height:1.55;
}
.concept-card{
  margin:14px 0;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(135deg,var(--surface2),var(--surface));border-left:4px solid var(--teal);
}
.concept-card b{color:var(--teal)}
.concept-card p{margin:4px 0 10px}
.concept-flow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.concept-flow span{
  padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  font-size:.74rem;color:var(--muted);
}
.concept-watch{font-size:.84rem;margin-top:8px}
.review-list{display:grid;gap:8px}
.review-link{
  display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 13px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  text-decoration:none;color:inherit;
}
.review-link:hover{border-color:var(--gold)}
.review-link small{color:var(--muted);font-size:.78rem}
.review-link .due{flex:0 0 auto;font-family:var(--font-mono);font-size:.72rem;color:var(--gold)}
@media (max-width:900px){
  .topbar{flex-wrap:wrap}
  .nav{order:3;width:100%;overflow-x:auto;padding-bottom:2px}
  .stat-row{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  main{width:min(100% - 20px,1180px)}
  .hero h1{font-size:2rem}
  .stat-row{grid-template-columns:1fr 1fr}
  .course-row{grid-template-columns:8px 1fr}
  .course-row .meta{display:none}
  .book-pair,.code-pair{grid-template-columns:1fr}
  .pair-arrow{display:none}
  .dual-range,.phase-line{grid-template-columns:1fr}
  .deep-stats{grid-template-columns:1fr 1fr}
  .deep-book>summary{grid-template-columns:7px minmax(0,1fr)}
  .deep-book>summary .meta{display:none}
  .chapter-grid,.syllabus-week{grid-template-columns:1fr}
  .insight-grid{grid-template-columns:1fr}
  .insight-head{flex-direction:column}
  .lesson-grid{grid-template-columns:1fr}
  .lesson summary{flex-direction:column;align-items:flex-start;gap:4px}
  .lesson summary .lmeta{white-space:normal}
  .chat-panel{right:10px;bottom:10px;width:calc(100vw - 20px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;scroll-behavior:auto!important}
}
@media print{
  body{background:#fff}
  .topbar,.chat-panel,.modal,.search-modal,.toast,.chat-actions{display:none!important}
  main{width:100%!important;max-width:none!important}
  .lesson{break-inside:avoid}
  .chapter-card,.deep-book,.syllabus-card{break-inside:avoid}
  .lesson-notes textarea{border:none;background:none}
  a{color:#000}
}
</style>

<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#/home">SCAI <span>STUDY</span></a>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" title="搜索课程 / 知识点 / 视频（Ctrl+K）" aria-label="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>

      </button>
      <button class="btn btn-primary" id="aiBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7L20 10l-6.1 1.3L12 17l-1.9-5.7L4 10l6.1-1.3z"/><path d="M19 15l.7 2.1L22 18l-2.3.9L19 21l-.7-2.1L16 18l2.3-.9z"/></svg>
        AI 助手
      </button>
    </div>
  </header>
  <main id="app"></main>
</div>

<aside class="chat-panel" id="chatPanel" aria-label="AI 学习助手">
  <div class="chat-head">
    <div>
      <b>AI 学习助手</b>
      <div class="sub" id="chatCourse">未选择课程</div>
    </div>
    <button id="chatClose" aria-label="关闭助手">×</button>
  </div>
  <div class="chat-msgs" id="chatMessages"></div>
  <div class="chat-actions">
    <button class="btn" id="chatAnalyze">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7L20 10l-6.1 1.3L12 17l-1.9-5.7L4 10l6.1-1.3z"/><path d="M19 15l.7 2.1L22 18l-2.3.9L19 21l-.7-2.1L16 18l2.3-.9z"/></svg>
      分析课件
    </button>
    <button class="btn" id="chatPlan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7L20 10l-6.1 1.3L12 17l-1.9-5.7L4 10l6.1-1.3z"/></svg>

  <form class="chat-form" id="chatForm">

<div class="search-modal" id="searchModal" role="dialog" aria-modal="true" aria-label="全局搜索">
  <div class="search-panel">

<script>
(function(){
"use strict";
const data = window.SCAI_COURSES || [];
const meta = window.SCAI_META || {};
const books = window.SCAI_BOOKS || [];
const plan = window.SCAI_PLAN || {weeks:[],daily:[]};
const compare = window.SCAI_COMPARE || {similarities:[],differences:[],terms:[]};
const dual = window.SCAI_DUAL || {groups:[],principle:[],yearPlan:null};
const china = window.SCAI_CHINA || {books:[],syllabus:{},principle:[]};
const competitions = window.SCAI_COMPETITIONS || {competitions:[]};
const DAYS = ["周一","周二","周三","周四","周五","周六","周日"];

const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

let state = {
  theme: LS.get("scai_theme","light"),
  quiz: LS.get("scai_quiz_scores",{}),
  progress: LS.get("scai_progress",{}),
  notes: LS.get("scai_notes",{}),
  courseware: LS.get("scai_uploaded_courseware",{}),
  insights: LS.get("scai_courseware_insights",{}),
  insightLoading: {},
  llm: LS.get("scai_llm_config", null),
  dual: LS.get("scai_dual_group","calculus"),
  chat: [],
  currentCourse: null,
  week: LS.get("scai_plan_week", null),
  timetable: LS.get("scai_timetable", null),
  competitionGoals: LS.get("scai_competition_goals", {}),
  growthProgress: LS.get("scai_growth_progress", {}),
  dailyProfile: LS.get("scai_daily_profile", { startDate: "2026-10-05" }),
  wordRecords: LS.get("scai_word_records", {}),
  dailyTasks: LS.get("scai_daily_tasks", { byDate: {}, listening: {} }),
  programmingRecords: LS.get("scai_programming_records", {}),
  dailyCheckins: LS.get("scai_daily_checkins", {})
};

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function save(){

function calendarWeek(){
  const start=new Date(2026,7,31);
  const diff=Math.floor((new Date()-start)/86400000);
  if(diff<0) return 1;
  return Math.max(1,Math.floor(diff/7)+1);
}

function openSearch(){
  $("#searchModal").classList.add("open");
  $("#searchInput").value="";
  renderSearch("");
  setTimeout(()=>$("#searchInput").focus(),30);
}
function closeSearch(){
  $("#searchModal").classList.remove("open");
  searchActive=-1;
  searchResults=[];
}
function renderSearch(q){
  const term=q.trim().toLowerCase();
  searchResults=term
    ? searchIndex.filter(it=>it.text.toLowerCase().includes(term)||it.title.toLowerCase().includes(term)).slice(0,12)
    : searchIndex.slice(0,8);
  searchActive=searchResults.length?0:-1;
  const box=$("#searchResults");
  box.innerHTML=searchResults.length
    ? searchResults.map((it,i)=>`
      <button class="search-item${i===searchActive?" active":""}" data-i="${i}" type="button">
        <span><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></span>
        <span class="s-tag">${esc(it.type)}</span>
      </button>`).join("")
    : `<div class="empty">没有找到相关内容，试试搜索“极限”、“矩阵”、“牛顿”或“Python”。</div>`;
  $$(".search-item",box).forEach(btn=>btn.addEventListener("click",()=>{
    const it=searchResults[Number(btn.dataset.i)];
    if(!it) return;
    if(it.url) window.open(it.url,"_blank","noopener");
    else{
      if(it.kind==="plan"){
        const m=it.title.match(/第\s*(\d+)\s*周/);
        if(m){ state.week=Number(m[1]); save(); }
      }
      location.hash=it.hash;
    }
    closeSearch();
  }));
}
function moveSearch(delta){
  if(!searchResults.length) return;
  searchActive=(searchActive+delta+searchResults.length)%searchResults.length;
  $$(".search-item",$("#searchResults")).forEach((b,i)=>b.classList.toggle("active",i===searchActive));
}
function bindSearch(){
  $("#searchBtn").addEventListener("click",openSearch);
  $("#searchInput").addEventListener("input",e=>renderSearch(e.target.value));
  $("#searchInput").addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); moveSearch(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); moveSearch(-1); }
    else if(e.key==="Enter"){
      e.preventDefault();
      const btn=$(".search-item.active",$("#searchResults"));
      if(btn) btn.click();
    }
  });
  $("#searchModal").addEventListener("click",e=>{ if(e.target.id==="searchModal") closeSearch(); });
  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){
      e.preventDefault();
      $("#searchModal").classList.contains("open")?closeSearch():openSearch();
    }else if(e.key==="Escape"&&$("#searchModal").classList.contains("open")){
      closeSearch();
    }
  });
}

function homeDateKey(date){
  const d=date||new Date();
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function homeDateFromKey(key){
  const [y,m,d]=String(key).split("-").map(Number);
  return new Date(y,m-1,d,0,0,0,0);
}
function homeAddDays(key,n){
  const d=homeDateFromKey(key);d.setDate(d.getDate()+n);return homeDateKey(d);
}
function homeDailySummary(){
  const start=(state.dailyProfile&&state.dailyProfile.startDate)||"2026-10-05";
  const today=homeDateKey();
  const date=homeDateFromKey(today)<homeDateFromKey(start)?start:today;
  const day=Math.max(1,Math.round((homeDateFromKey(date)-homeDateFromKey(start))/86400000)+1);
  const task=(state.dailyTasks&&state.dailyTasks.byDate&&state.dailyTasks.byDate[date])||{};
  const listeningRecord=task.listeningId&&state.dailyTasks.listening&&state.dailyTasks.listening[task.listeningId];
  const program=task.programmingDay&&state.programmingRecords&&state.programmingRecords[task.programmingDay];
  let streakDate=state.dailyCheckins&&state.dailyCheckins[today]?today:homeAddDays(today,-1);
  let streak=0;
  while(state.dailyCheckins&&state.dailyCheckins[streakDate]){streak+=1;streakDate=homeAddDays(streakDate,-1)}
  return {
    day,
    dateLabel:date.replace(/-/g,"."),
    vocab:!!task.vocab,
    listening:!!(listeningRecord&&listeningRecord.completedAt),
    programming:!!(program&&program.completedAt),
    streak
  };
}

function ext(name){ const i=name.lastIndexOf("."); return i>=0?name.slice(i+1).toLowerCase():""; }
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=src;
    s.onload=()=>res();
    s.onerror=()=>rej(new Error("CDN 加载失败，请联网后重试，或把课件转存为 .txt/.md"));
    document.head.appendChild(s);
  });
}
async function parseFile(file){
  const e=ext(file.name);
  if(["txt","md","markdown"].includes(e)) return await file.text();
  const buf=await file.arrayBuffer();
  if(e==="pdf") return await parsePdf(buf);
  if(e==="docx") return await parseDocx(buf);
  if(e==="pptx") return await parsePptx(buf);
  throw new Error("不支持的文件类型");
}
async function parsePdf(buf){
  if(!window.pdfjsLib){
    await loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  }
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  const n=Math.min(pdf.numPages,80);
  for(let i=1;i<=n;i++){
    const pg=await pdf.getPage(i);
    const tc=await pg.getTextContent();
    pages.push(tc.items.map(it=>it.str||"").join(" "));
  }
  return pages.join("\n");
}
async function parseDocx(buf){
  if(!window.mammoth) await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js");
  const res=await window.mammoth.extractRawText({arrayBuffer:buf});
  return res.value||"";
}
async function parsePptx(buf){
  if(!window.JSZip) await loadScript("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js");
  const zip=await window.JSZip.loadAsync(buf);
  const readXml=n=>zip.file(n).async("string").then(xml=>{
    const doc=new DOMParser().parseFromString(xml,"application/xml");
    return (doc.documentElement.textContent||"").replace(/\s+/g," ");
  });
  const slides=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>Number(a.match(/\d+/)[0])-Number(b.match(/\d+/)[0]));
  const notes=Object.keys(zip.files).filter(n=>/^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(n)).sort((a,b)=>Number(a.match(/\d+/)[0])-Number(b.match(/\d+/)[0]));
  const slideText=[];
  for(const n of slides) slideText.push("【Slide "+(n.match(/\d+/)[0])+"】"+await readXml(n));
  const noteText=[];
  if(notes.length) noteText.push("【Speaker Notes】");
  for(const n of notes) noteText.push(await readXml(n));
  return slideText.concat(noteText).join("\n");
}
async function handleFiles(files,courseId){
  const arr=Array.from(files||[]);
  let lastStored=null;
  for(const file of arr){
    try{
      toast("正在解析 " + file.name + " ...");
      const text=await parseFile(file);
      if(!text.trim()) throw new Error("没有提取到可分析文字；如果是图片型 PPT，请先补充讲者备注或转成带文本的 PDF");
      const list=state.courseware[courseId]||[];
      lastStored={name:file.name,size:file.size,ts:Date.now(),text:text.slice(0,60000)};
      list.unshift(lastStored);
      state.courseware[courseId]=list.slice(0,6);
      save();
      renderCoursewareList(courseId);
      toast("已解析 " + file.name + "，正在生成知识结构");
    }catch(err){
      console.error(err);
      toast("解析失败：" + file.name + " · " + err.message);
    }
  }
  if(lastStored) await generateCoursewareInsights(courseId,lastStored);
  const input=document.getElementById("file-"+courseId);
  if(input) input.value="";
}

function getLLMConfig(){
  const base={baseURL:"https://api.deepseek.com/v1",model:"deepseek-chat",apiKey:""};
  if(state.llm && state.llm.apiKey) return Object.assign({},base,state.llm);
  if(window.LLM_CONFIG && window.LLM_CONFIG.apiKey) return Object.assign({},base,window.LLM_CONFIG);
  return base;
}
function parseAIJson(text){
  const raw=String(text||"").replace(/```(?:json)?/gi,"").replace(/```/g,"").trim();
  const start=raw.indexOf("{"),end=raw.lastIndexOf("}");
  if(start<0||end<=start) throw new Error("AI 未返回 JSON 对象");
  return JSON.parse(raw.slice(start,end+1));
}
function textLines(text){
  return [...new Set(String(text||"")
    .split(/\n|(?<=[。！？!?;；])/)
    .map(x=>x.replace(/\s+/g," ").trim())
    .filter(x=>x.length>=6&&x.length<=120)
    .filter(x=>!/^(目录|谢谢|谢谢观看|本章结束|幻灯片|slide\s*\d+)$/i.test(x)))]
    .slice(0,18);
}
function matchCourseLesson(course,text){
  if(!course||!course.lessons||!course.lessons.length) return null;
  const hay=String(text||"").toLowerCase();
  let best=null,bestScore=0;
  for(const lesson of course.lessons){
    const terms=[lesson.title,lesson.en,...(lesson.points||[])]
      .flatMap(x=>String(x||"").split(/[\s·、,，:：/()（）与和]+/))
      .map(x=>x.trim().toLowerCase())
      .filter(x=>x.length>=2);
    let score=0;
    for(const term of terms) if(hay.includes(term)) score+=term.length>4?2:1;
    if(score>bestScore){ best=lesson; bestScore=score; }
  }
  return best||course.lessons[0];
}
function offlineCoursewareInsights(course,record,reason){
  const lines=textLines(record.text);
  const lesson=matchCourseLesson(course,record.text)||{title:"本课",points:[],pitfalls:[],exams:[]};
  const keyPoints=(lines.length?lines:lesson.points).slice(0,10);
  const pitfalls=(course&&course.lessons||[]).flatMap(l=>l.pitfalls||[]).slice(0,8);
  const exams=(course&&course.lessons||[]).flatMap(l=>l.exams||[]).slice(0,8);
  return {
    fileName:record.name,
    generatedAt:Date.now(),
    mode:"offline",
    note:reason||"未配置 AI Key，使用本地文本抽取结果。",
    lesson:lesson.title,
    summary:`已从《${record.name}》提取 ${record.text.length} 个字符，并匹配到《${lesson.title}》。已整理章节标题、概念和复习线索。${reason?" "+reason:""}`,
    keyPoints,
    pitfalls,
    reviewQuestions:[
      ...exams.slice(0,3).map(x=>"能否独立完成："+x),
      "不看课件，用 3 分钟复述本课主线。",
      "列出本课最容易混淆的两个概念并说明区别。"
    ],
    mindmap:{
      root:(course&&course.name)||record.name,
      branches:[
        {title:"核心概念",items:keyPoints.slice(0,5)},
        {title:"易错点",items:pitfalls.slice(0,4)},
        {title:"高频考法",items:exams.slice(0,4)},
        {title:"复习路径",items:["回顾课件标题","复述定义","重做例题","闭卷自测","错题复述"]}
      ]
    }
  };
}
function normalizeCoursewareInsights(raw,course,record,mode,note){
  const arr=(value,limit)=>Array.isArray(value)?value.filter(x=>typeof x==="string"&&x.trim()).slice(0,limit):[];
  const branches=Array.isArray(raw&&raw.mindmap&&raw.mindmap.branches)
    ? raw.mindmap.branches.map(b=>({title:String(b&&b.title||"分支"),items:arr(b&&b.items,6)})).filter(b=>b.items.length).slice(0,8)
    : [];
  const matched=matchCourseLesson(course,record.text);
  return {
    fileName:record.name,
    generatedAt:Date.now(),
    mode,
    note:note||"",
    lesson:String(raw&&raw.lesson||(matched&&matched.title)||"本课").slice(0,120),
    summary:String(raw&&raw.summary||"").slice(0,600),
    keyPoints:arr(raw&&raw.keyPoints,12),
    pitfalls:arr(raw&&raw.pitfalls,10),
    reviewQuestions:arr(raw&&raw.reviewQuestions,10),
    mindmap:{
      root:String(raw&&raw.mindmap&&raw.mindmap.root||(course&&course.name)||record.name).slice(0,100),
      branches
    }
  };
}
async function requestAI(messages,options){
  const cfg=getLLMConfig();
  if(!cfg.apiKey) throw new Error("未配置 API Key");
  const res=await fetch(cfg.baseURL.replace(/\/+$/,"")+"/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.apiKey},
    body:JSON.stringify({
      model:cfg.model||"deepseek-chat",
      messages,
      max_tokens:(options&&options.maxTokens)||900,
      temperature:options&&options.temperature!=null?options.temperature:0.3
    })
  });
  if(!res.ok){
    const t=await res.text().catch(()=>"");
    throw new Error("HTTP "+res.status+" "+t.slice(0,160));
  }
  const j=await res.json();
  const out=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(!out) throw new Error("AI 返回空响应");
  return out;
}
async function generateCoursewareInsights(courseId,record){
  const course=data.find(x=>x.id===courseId);
  if(!course||!record) return;
  state.insightLoading[courseId]=true;
  rerenderCoursewareInsights(courseId);
  let insight;
  try{
    const cfg=getLLMConfig();
    if(!cfg.apiKey){
      insight=offlineCoursewareInsights(course,record,"请在设置中填写 API Key 以获得更深入的概念归纳。");
    }else{
      const courseContext=(course.lessons||[]).slice(0,12).map(l=>l.title+"："+(l.points||[]).join("；")).join("\n");
      const prompt=[
        "你是严谨的大一课程助教。请只根据给定课件内容生成本节课复习结构，不使用外部网页。",
        "输出必须是单个 JSON 对象，不要 Markdown 代码围栏，不要附加解释。",
        "JSON 结构：",
        '{"lesson":"从课程目录中选择最匹配的一节","summary":"150字内本课主线","keyPoints":["5-10条关键知识点"],"pitfalls":["4-8条易错点"],"reviewQuestions":["5-8个闭卷自测问题"],"mindmap":{"root":"本课主题","branches":[{"title":"分支名","items":["3-6个短节点"]}]}}',
        "思维导图必须包含 5-7 个分支，覆盖概念、公式/机制、例题、易错点、考试或应用、复习路径。",
        "课程："+course.name+"（"+course.enName+"）",
        "课程目录（lesson 必须优先选择其中之一）：\n"+(course.lessons||[]).map((l,i)=>(i+1)+". "+l.title+" / "+l.en).join("\n"),
        "课程知识背景：\n"+courseContext,
        "课件文件名："+record.name,
        "课件文本：\n"+record.text.slice(0,16000)
      ].join("\n");
      try{
        const answer=await requestAI([
          {role:"system",content:"你负责把课堂课件转成结构化学习资料。内容准确、简洁、面向考试复习。"},
          {role:"user",content:prompt}
        ],{maxTokens:2400,temperature:0.2});
        insight=normalizeCoursewareInsights(parseAIJson(answer),course,record,"ai");
        if(!insight.keyPoints.length) throw new Error("AI 未生成关键知识点");
      }catch(err){
        console.warn("AI insight fallback",err);
        insight=offlineCoursewareInsights(course,record,"在线 AI 生成失败，已切换到本地分析："+err.message);
      }
    }
  }catch(err){
    insight=offlineCoursewareInsights(course,record,"生成失败，已使用本地分析："+err.message);
  }
  state.insights[courseId]=insight;
  state.insightLoading[courseId]=false;
  save();
  rerenderCoursewareInsights(courseId);
  if(state.currentCourse===courseId) renderChat();
  toast(insight.mode==="ai"?"AI 已生成知识点与思维导图":"已生成本地知识结构");
}
function buildSystemPrompt(courseId){
  const c=data.find(x=>x.id===courseId);
  let s="你是 SCAI ME1 学习助手。你的任务：结合课程、课件和 16 周计划，用中文给出准确、可执行的回答；公式用清晰文本形式表达。";
  if(c){
    s+="\n当前课程："+c.name+"（"+c.enName+"）";
    s+="\n课程摘要："+c.summary;
    s+="\n章节："+c.chapters;
    s+="\n知识点概要："+c.lessons.slice(0,4).map(l=>l.title+"："+l.points.join("；")).join("\n");
  }
  const cw=state.courseware[courseId]||[];
  if(cw.length) s+="\n\n已上传课件摘要：\n"+cw.slice(0,3).map(f=>"【"+f.name+"】"+f.text.slice(0,1200)).join("\n");
  else s+="\n\n当前课程尚未上传课件。";
  const insight=state.insights[courseId];
  if(insight){
    s+="\n\n课件结构化分析：";
    s+="\n课程主线："+(insight.summary||"");
    s+="\n关键知识点："+(insight.keyPoints||[]).join("；");
    s+="\n易错点："+(insight.pitfalls||[]).join("；");
    s+="\n复习问题："+(insight.reviewQuestions||[]).join("；");
  }
  return s;
}
async function askAI(text,courseId){
  const cfg=getLLMConfig();
  if(!cfg.apiKey) return offlineAnswer(text,courseId);
  const messages=[{role:"system",content:buildSystemPrompt(courseId)},{role:"user",content:text}];
  try{
    return await requestAI(messages,{maxTokens:1100,temperature:0.3});
  }catch(err){
    console.warn(err);
    return offlineAnswer(text,courseId)+"\n\n[在线 AI 请求失败："+err.message+"，已切换离线模式]";
  }
}
function offlineAnswer(text,courseId){
  const t=(text||"").toLowerCase();
  const c=data.find(x=>x.id===courseId);
  if(/调整|计划|课件/.test(t) && c) return adjustPlanOffline(c);
  if(c){
    const lesson=c.lessons.find(l=>{
      const hay=(l.title+l.en+l.points.join("")).toLowerCase();
      const words=t.split(/\s+/).filter(w=>w.length>1);
      return words.some(w=>hay.includes(w));
    });
    if(lesson){
      return "离线模式命中："+lesson.title+"。\n核心知识点：\n"+lesson.points.map(x=>"· "+x).join("\n")+"\n易错点：\n"+lesson.pitfalls.map(x=>"· "+x).join("\n")+"\n高频考点：\n"+lesson.exams.map(x=>"· "+x).join("\n");
    }
    return "离线模式：当前课程为"+c.name+"。建议先过一遍本周知识点，再完成 PDF 练习并对照解析订正。若想让回答更精准，可在设置中填入 API Key，或在课件区上传老师课件。";
  }
  return "离线模式：你可以问我某门课的具体知识点，例如“极限怎么求”“特征值怎么算”。配置 API Key 后可获得更深入的个性化回答。";
}
function adjustPlanOffline(c){
  const cw=state.courseware[c.id]||[];
  const all=cw.map(f=>f.text).join("\n");
  const count=(re)=>(all.match(re)||[]).length;
  const hits=[];
  if(count(/期中|midterm/gi)) hits.push("检测到“期中”相关内容，建议第 7 周前完成本章错题清零并安排一次模考。");
  if(count(/期末|final|exam/gi)) hits.push("检测到“期末/考试”相关内容，建议把本章加入第 12-15 周高频考点清单。");
  if(count(/实验|lab|report|报告/gi)) hits.push("检测到实验/报告任务，建议提前两周起草英文报告并安排小组分工。");
  if(count(/重点|考点|关键/gi)) hits.push("课件中出现“重点/考点”字样，建议整理为章节错题卡并让 AI 生成自测题。");
  if(!hits.length) hits.push("课件中暂未识别到考试或报告信号；建议按 16 周计划推进，并在每章结束后完成 PDF 练习并订正。");
  let out="基于当前课件给出的计划调整：\n";
  out+=hits.map(x=>"· "+x).join("\n");
  out+="\n当前课件："+(cw.map(f=>f.name).join("、")||"无");
  out+="\n建议：把课件例题作为第一轮练习，再把教材习题按难度分层完成。";
  return out;
}

function chatCourseName(){ const c=data.find(x=>x.id===state.currentCourse); return c?c.name:"未选择课程"; }
function renderChat(){
  const box=$("#chatMessages");
  box.innerHTML=state.chat.map(m=>`<div class="msg ${m.role}"><span class="mhead">${m.role==="user"?"你":"AI"}</span>${esc(m.content)}</div>`).join("")||`<div class="empty">问任何课程问题，或点击“根据课件调整计划”。</div>`;
  box.scrollTop=box.scrollHeight;
  $("#chatCourse").textContent=chatCourseName();
}
function openChat(courseId){
  if(courseId) state.currentCourse=courseId;
  $("#chatPanel").classList.add("open");
  renderChat();
  setTimeout(()=>$("#chatInput").focus(),60);
}
async function sendChat(text){
  if(!text){ $("#chatInput").focus(); return; }
  state.chat.push({role:"user",content:text});
  state.chat.push({role:"assistant",content:"思考中..."});
  renderChat();
  const answer=await askAI(text,state.currentCourse);
  state.chat[state.chat.length-1]={role:"assistant",content:answer};
  renderChat();
}
function bindChat(){
  $("#aiBtn").addEventListener("click",()=>openChat(null));
  $("#chatClose").addEventListener("click",()=>$("#chatPanel").classList.remove("open"));
  $("#chatForm").addEventListener("submit",e=>{
    e.preventDefault();
    const input=$("#chatInput");
    const text=input.value.trim();
    input.value="";
    sendChat(text);
  });
  $("#chatPlan").addEventListener("click",()=>{
    const c=data.find(x=>x.id===state.currentCourse);
    if(!c){ toast("请先进入某门课程页再使用此功能"); openChat(null); return; }
    sendChat("请根据当前课件调整我的学习计划。");
  });
  $("#chatAnalyze").addEventListener("click",()=>{
    const c=data.find(x=>x.id===state.currentCourse);
    if(!c){ toast("请先进入某门课程页再使用此功能"); openChat(null); return; }
    const cw=state.courseware[c.id]||[];
    if(!cw.length){ toast("请先在该课程页上传 PPTX / PDF / DOCX"); return; }
    generateCoursewareInsights(c.id,cw[0]);
  });
}

function renderSettings(){
  const cfg=getLLMConfig();
  $("#cfgBase").value=cfg.baseURL||"";
  $("#cfgModel").value=cfg.model||"";
  $("#cfgKey").value=cfg.apiKey||"";
  const sel=$("#cfgCourse");
  sel.innerHTML=data.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
  sel.value=state.currentCourse||"calculus";
}
function exportStudyData(){
  const payload={
    app:"scai-me1",
    version:1,
    exportedAt:new Date().toISOString(),
    theme:state.theme,
    quiz:state.quiz,
    progress:state.progress,
    notes:state.notes,
    courseware:state.courseware,
    insights:state.insights,
    week:state.week,
    timetable:state.timetable,
    chat:state.chat,
    competitionGoals:state.competitionGoals,
    growthProgress:state.growthProgress,
    dailyProfile:state.dailyProfile,
    wordRecords:state.wordRecords,
    dailyTasks:state.dailyTasks,
    programmingRecords:state.programmingRecords,
    dailyCheckins:state.dailyCheckins
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="scai-study-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  toast("学习数据已导出（不含 API Key）");
}
async function importStudyData(file){
  try{
    const j=JSON.parse(await file.text());
    if(!j||typeof j!=="object"||!j.progress) throw new Error("文件格式不是 SCAI 学习数据备份");
    state.theme=j.theme||state.theme;
    state.quiz=j.quiz||{};
    state.progress=j.progress||{};
    state.notes=j.notes||{};
    state.courseware=j.courseware||{};
    state.insights=j.insights||{};
    state.week=j.week||null;
    state.timetable=j.timetable||null;
    state.chat=Array.isArray(j.chat)?j.chat:[];
    state.competitionGoals=j.competitionGoals||{};
    state.growthProgress=j.growthProgress||{};
    state.dailyProfile=j.dailyProfile||state.dailyProfile;
    state.wordRecords=j.wordRecords||{};
    state.dailyTasks=j.dailyTasks||{byDate:{},listening:{}};
    state.programmingRecords=j.programmingRecords||{};
    state.dailyCheckins=j.dailyCheckins||{};
    save();
    applyTheme();
    render();
    toast("学习数据已导入");
  }catch(err){
    console.error(err);
    toast("导入失败："+err.message);
  }
}
function bindSettings(){
  $("#settingsBtn").addEventListener("click",()=>{ renderSettings(); $("#settingsModal").classList.add("open"); });
  $("#cfgClose").addEventListener("click",()=>$("#settingsModal").classList.remove("open"));
  $("#cfgSave").addEventListener("click",()=>{
    state.llm={
      baseURL:$("#cfgBase").value.trim()||"https://api.deepseek.com/v1",
      model:$("#cfgModel").value.trim()||"deepseek-chat",
      apiKey:$("#cfgKey").value.trim()
    };
    if(!state.llm.apiKey && window.LLM_CONFIG) window.LLM_CONFIG.apiKey="";
    state.currentCourse=$("#cfgCourse").value||state.currentCourse;
    save();
    toast("配置已保存");
    $("#settingsModal").classList.remove("open");
  });
  $("#cfgExport").addEventListener("click",exportStudyData);
  const importFile=$("#cfgImportFile");
  if(importFile) importFile.addEventListener("change",()=>{
    if(importFile.files[0]) importStudyData(importFile.files[0]);
    importFile.value="";
  });
  $("#cfgClear").addEventListener("click",()=>{
    if(!confirm("确定清除本地学习数据与 AI 配置？")) return;
    state.quiz={}; state.progress={}; state.notes={}; state.courseware={}; state.insights={}; state.llm=null; state.chat=[]; state.timetable=null; state.week=null; state.competitionGoals={}; state.growthProgress={}; state.dailyProfile={startDate:"2026-10-05"}; state.wordRecords={}; state.dailyTasks={byDate:{},listening:{}}; state.programmingRecords={}; state.dailyCheckins={};
    ["scai_quiz_scores","scai_progress","scai_notes","scai_uploaded_courseware","scai_courseware_insights","scai_llm_config","scai_dual_group","scai_plan_week","scai_timetable","scai_competition_goals","scai_growth_progress","scai_daily_profile","scai_word_records","scai_daily_tasks","scai_programming_records","scai_daily_checkins"].forEach(k=>LS.del(k));
    if(window.LLM_CONFIG) window.LLM_CONFIG.apiKey="";
    render();
    toast("本地数据已清除");
  });
  $("#settingsModal").addEventListener("click",e=>{ if(e.target.id==="settingsModal") $("#settingsModal").classList.remove("open"); });
}

function parseCsvTimetable(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const head=lines[0].split(",").map(s=>s.trim().toLowerCase());
  const idx={
    day:head.findIndex(h=>/星期|day|weekday/.test(h)),
    period:head.findIndex(h=>/节|period/.test(h)),
    start:head.findIndex(h=>/开始|start/.test(h)),
    end:head.findIndex(h=>/结束|end/.test(h)),
    course:head.findIndex(h=>/课程|course/.test(h)),
    room:head.findIndex(h=>/教室|room/.test(h))
  };
  return lines.slice(1).map(line=>{
    const c=line.split(",").map(s=>s.trim());
    return {
      day:idx.day>=0?c[idx.day]||"":"",
      period:idx.period>=0?c[idx.period]||"1":"1",
      start:idx.start>=0?c[idx.start]||"":"",
      end:idx.end>=0?c[idx.end]||"":"",
      course:idx.course>=0?c[idx.course]||"":"",
      room:idx.room>=0?c[idx.room]||"":""
    };
  }).filter(r=>r.course);
}
function normalizeTtRow(r){
  let day=String(r.day||r.weekday||"");
  if(/周一|星期一|mon/i.test(day)) day=1;
  else if(/周二|星期二|tue/i.test(day)) day=2;
  else if(/周三|星期三|wed/i.test(day)) day=3;
  else if(/周四|星期四|thu/i.test(day)) day=4;
  else if(/周五|星期五|fri/i.test(day)) day=5;
  else if(/周六|星期六|sat/i.test(day)) day=6;
  else if(/周日|星期日|sun/i.test(day)) day=7;
  else day=Number(day)||1;
  return {day,period:String(r.period||"1"),start:r.start||"",end:r.end||"",course:r.course||"",room:r.room||""};
}
async function importTimetable(file){
  try{
    const text=await file.text();
    let rows=[];
    if(/\.json$/i.test(file.name)){
      const j=JSON.parse(text);
      rows=Array.isArray(j)?j:(j.items||j.courses||[]);
    }else{
      rows=parseCsvTimetable(text);
    }
    if(!rows.length) throw new Error("未解析到有效行");
    state.timetable=rows.map(normalizeTtRow);
    save();
    render();
    toast("课表已导入 "+rows.length+" 条");
  }catch(err){
    console.error(err);
    toast("课表导入失败："+err.message);
  }
}
function bindPlan(){
  $$("#weekTabs button").forEach(b=>b.addEventListener("click",()=>{
    state.week=Number(b.dataset.week);
    save();
    render();
  }));
  const tt=$("#ttFile");
  if(tt) tt.addEventListener("change",()=>importTimetable(tt.files[0]));
  const clear=$("#ttClear");
  if(clear) clear.addEventListener("click",()=>{
    state.timetable=null;
    save();
    render();
    toast("课表已清除");
  });
}

function bindTheme(){
  $("#themeBtn").addEventListener("click",()=>{
    state.theme=state.theme==="dark"?"light":"dark";
    applyTheme();
  });
}
function init(){
  bindTheme();
  bindChat();
  bindSettings();
  bindSearch();
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(err=>console.warn("SW register failed",err));
  }
  window.addEventListener("hashchange",render);
  render();
}
init();
})();
